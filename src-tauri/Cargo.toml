[package]
name = "terminalx"
version = "0.1.0"
description = "Infinite canvas terminal workspace"
authors = ["Fantom Labs"]
edition = "2021"
license = "MIT"
repository = "https://github.com/txc0ld/tmx"
homepage = "https://txc0ld.github.io/tmx/"
readme = "../README.md"

[lib]
name = "terminalx_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Filesystem watching
notify = "7"
notify-debouncer-mini = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for MCP API proxy
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
shellexpand = "3"
parking_lot = "0.12"

# OS keychain (macOS Keychain, Windows Credential Manager, Linux Secret
# Service) for MCP tokens. `apple-native` + `windows-native` use the
# built-in OS APIs; `linux-native-sync-persistent` routes through the
# system Secret Service (gnome-keyring / kwallet / KeePassXC).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
] }

# PTY management — desktop only (iOS/Android don't allow subprocess spawning)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
portable-pty = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
